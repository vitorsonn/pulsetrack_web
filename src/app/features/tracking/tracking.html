<div class="max-w-4xl mx-auto p-4 space-y-4">
  <!-- Cartão de Detalhes do Pedido -->
  <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 text-white shadow-xl">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">
          Acompanhar Pedido #{{ orderId }}
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Rastreamento de entrega em tempo real
        </p>
      </div>

      <!-- Badge do Status SSE -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold"
           [ngClass]="isConnected ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'">
        <span class="w-2 h-2 rounded-full animate-pulse"
              [ngClass]="isConnected ? 'bg-emerald-400' : 'bg-amber-400'"></span>
        {{ isConnected ? 'Ao Vivo (SSE)' : 'Aguardando Pulsos...' }}
      </div>
    </div>

    <!-- Informações do Cliente e Endereço -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4 text-sm">
      <div>
        <span class="text-slate-400 block text-xs uppercase tracking-wider font-medium">Cliente</span>
        <span class="font-semibold text-slate-200 mt-0.5 block">
          {{ orderDetails?.customerName || 'Carregando dados...' }}
        </span>
      </div>

      <div>
        <span class="text-slate-400 block text-xs uppercase tracking-wider font-medium">Endereço de Entrega</span>
        <span class="font-semibold text-slate-200 mt-0.5 block">
          {{ orderDetails?.deliveryAddress || 'Carregando endereço...' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Componente do Mapa -->
  <div class="overflow-hidden rounded-2xl shadow-xl">
    <app-map-view [currentLocation]="currentLocation"></app-map-view>
  </div>
</div>
